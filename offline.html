<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بدون إنترنت - بسمله هوم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Cairo', sans-serif;
      background: #0F0F0F;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
    }
    .icon { font-size: 100px; margin-bottom: 20px; animation: float 2s infinite; }
    h1 { color: #FFB800; font-size: 32px; margin-bottom: 12px; }
    p { color: #999; margin-bottom: 25px; font-size: 16px; }
    button {
      background: #FFB800;
      color: #0F0F0F;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-weight: 900;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      transition: all .3s;
    }
    button:hover {
      background: #E6A600;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,184,0,0.4);
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>اتأكد من اتصالك وجرب تاني</p>
    <button onclick="location.reload()">🔄 إعادة المحاولة</button>
  </div>
</body>
</html>
